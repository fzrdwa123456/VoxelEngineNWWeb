[package]
name = "voxelengine-tauri"
version = "1.0.0"
description = "VoxelEngine on Tauri — the same TypeScript + three.js + ECS frontend, with WebView2 as the shell"
authors = ["VoxelEngine"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri v2 template convention: the logic lives in the lib (testable, multi-platform entry),
# main.rs only calls run()
name = "voxelengine_tauri_lib"
# **rlib only, and Android's `.so` is produced by a COMMAND-LINE FLAG instead** (P1.85).
#
# A manifest `crate-type` is a property of the PACKAGE, not of the target, so there is no way to say
# "cdylib for Android, rlib for Windows" here. Declaring `["staticlib", "cdylib", "rlib"]` - what the
# Tauri template does - makes EVERY build of this crate link a `libvoxelengine_tauri_lib.dll` too, and
# on Windows + the GNU toolchain the DEBUG one cannot be linked:
#
#     ld.exe: error: export ordinal too large: 90913
#
# (The release profile survives it: LTO + `opt-level = "s"` + `strip` cut the export count below
# binutils' ordinal limit. Debug does not, and that is precisely the profile `tauri dev` uses - so the
# template's crate-type breaks `npm run app:dev` and `npm run app:android -- --debug` on this
# toolchain.)
#
# `scripts/build-android.mjs` therefore builds the Android library with
# `cargo rustc --lib --crate-type cdylib`, which emits the `.so` for that one invocation and leaves the
# manifest - and every desktop build - alone.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `base64` was only ever used by the pack walk, which now hands over raw bytes (P1.18f) — dependency gone.
# ===== THE WINDOWS-ONLY DEPENDENCIES (P1.79) =====
# Both are used by exactly ONE file, `src/platform/windows.rs`: `webview2-com` for the native
# WebView2 settings (plan A: disable the browser accelerator keys, so F3 no longer opens "Find") and
# `windows` for `windows::core::Interface`. Versions kept in step with what Cargo.lock already has
# (windows 0.61.3 / webview2-com 0.38.2). TARGET-GATED, because they are the Windows backend's
# business: a macOS/Linux build now reaches `platform/mod.rs`'s `compile_error!` - which names the
# one file a port has to write - instead of failing inside a crate it would never call.
#
# THE TWO GRAPHICS FEATURES (P1.86): `platform/windows/display.rs` asks DWM for the display's refresh
# RATE as an exact ratio (`DwmGetCompositionTimingInfo`), which the front end's frame pacing locks to.
# Both are opt-in in the `windows` crate, hence spelled out here.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Raw mouse input and SetCursorPos declare `extern "system"` directly (copied from the original
# rawinput/src/lib.rs), and deliberately do **not** pull in the windows crate: one less dependency
# and one less place to fight the toolchain.
[features]
# ===== Production build: EMBED the frontend output in the binary =====
# ⚠️ This feature is the self-contained-exe switch. `tauri build` enables it by itself, but a bare
#    `cargo build --release` **does not** — the resulting exe looks for tauri.conf.json's devUrl
#    (http://localhost:1420) and shows a **blank window** instead:
#      the process is alive, 10 threads, every msedgewebview2 component is up, but the page never
#      loads, logs\debug.log has not one line, and not even the inline script's "html loaded" in
#      index.html appears.
#    From the outside it looks almost exactly like "stuck in the loader" and is very hard to
#    localise — so scripts/package-portable.mjs now checks the exe for the frontend payload and
#    fails loudly when it is missing.
#    To build a self-contained exe with bare cargo:
#      cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
