<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxelEngine</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    * { user-select: none; }
    *:focus { outline: none; box-shadow: none; }
    #app { width: 100vw; height: 100vh; }
    /* Static boot splash: painted as soon as this document is parsed, before any JS bundle loads, so the
       window never shows an empty/black page while the engine boots. Removed by the engine once its own
       loading screen is in the DOM (host/browser/presentation.ts::removeBootSplash). */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0b0d10; color: #e8e8e8;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      transition: opacity 0.2s linear;
    }
    #boot-splash .title {
      font-size: 42px; font-weight: 700; letter-spacing: 0.18em;
      text-shadow: 0 2px 0 #000, 0 0 18px rgba(106, 169, 255, 0.35);
    }
    #boot-splash .sub { margin-top: 14px; font-size: 14px; letter-spacing: 0.12em; color: #9aa4ad; }
    #boot-splash .bar { margin-top: 22px; width: 220px; height: 4px; background: #1e242b; border-radius: 2px; overflow: hidden; }
    #boot-splash .bar i { display: block; width: 40%; height: 100%; background: #6aa9ff; animation: boot-bar 1.1s ease-in-out infinite; }
    @keyframes boot-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #boot-splash.boot-splash-out { opacity: 0; pointer-events: none; }
  </style>
  <!--
    The earliest safety net.
    ------------------------------------------------------------------
    **It MUST be a classic script (not a module), and it MUST come before the module**:
    a module script that fails to load or parse never reaches any try/catch, and in Tauri a
    dead frontend is **silent** — no window, not one line in debug.log, indistinguishable from
    "stuck in the loader" from the outside.
    So this talks to the IPC global directly (not through @tauri-apps/api, which may be exactly
    the broken part at that moment), writing the message to logs\boot.log and also onto
    document.title (visible in the process list).
  -->
  <script>
    (function () {
      function report(msg) {
        var text = String(msg);
        try {
          var internals = window.__TAURI_INTERNALS__;
          if (internals && internals.invoke) internals.invoke("boot_report", { message: text });
        } catch (e) { /* not even the IPC is there: the title is all that is left */ }
        try { document.title = "VoxelEngine [boot: " + text + "]"; } catch (e) {}
      }
      window.__bootReport = report;
      window.addEventListener("error", function (e) {
        report("error: " + (e.message || e.type) + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        report("rejection: " + String(e.reason));
      });
      report("html loaded @" + Math.round(performance.now()) + "ms");
      // Startup-timing probe: these lines land in game\logs\boot.log with the navigation-relative time, so
      // "window -> splash" can be told apart from "splash -> engine loading screen".
      document.addEventListener("DOMContentLoaded", function () {
        report("domcontentloaded @" + Math.round(performance.now()) + "ms");
      });
      window.addEventListener("load", function () {
        report("load event @" + Math.round(performance.now()) + "ms");
      });
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          report("first paint @" + Math.round(performance.now()) + "ms");
        });
      });
    })();
  </script>
</head>
<body>
  <div id="boot-splash">
    <div class="title">VOXELCRAFT</div>
    <div class="sub">Loading…</div>
    <div class="bar"><i></i></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/boot/main.ts"></script>
</body>
</html>
