<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxelEngine</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    * { user-select: none; }
    *:focus { outline: none; box-shadow: none; }
    #app { width: 100vw; height: 100vh; }
  </style>
  <!--
    The earliest safety net.
    ------------------------------------------------------------------
    **It MUST be a classic script (not a module), and it MUST come before the module**:
    a module script that fails to load or parse never reaches any try/catch, and in Tauri a
    dead frontend is **silent** — no window, not one line in debug.log, indistinguishable from
    "stuck in the loader" from the outside.
    So this talks to the IPC global directly (not through @tauri-apps/api, which may be exactly
    the broken part at that moment), writing the message to logs\boot.log and also onto
    document.title (visible in the process list).
  -->
  <script>
    (function () {
      function report(msg) {
        var text = String(msg);
        try {
          var internals = window.__TAURI_INTERNALS__;
          if (internals && internals.invoke) internals.invoke("boot_report", { message: text });
        } catch (e) { /* not even the IPC is there: the title is all that is left */ }
        try { document.title = "VoxelEngine [boot: " + text + "]"; } catch (e) {}
      }
      window.__bootReport = report;
      window.addEventListener("error", function (e) {
        report("error: " + (e.message || e.type) + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        report("rejection: " + String(e.reason));
      });
      report("html loaded");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/boot/main.ts"></script>
</body>
</html>
